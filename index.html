<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crimson Castle</title>
    <link rel="icon" href="CrimsonCastle.ico">
    <meta name="theme-color" content="#101827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crimson Castle">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="hud">
        <div class="hud-topline">
            <div class="game-brand">
                <div class="game-title">CRIMSON CASTLE</div>
                <div class="cc-battle-version cc-version-label">Loading version...</div>
            </div>

            <div class="resources">
                <div class="resource metal">
                    <span class="resource-icon">◆</span>
                    Metal: <span id="metal-count">500</span>
                </div>
                <div class="resource research">
                    <span class="resource-icon">✦</span>
                    Research: <span id="research-count">0</span>
                </div>
                <div class="resource wood">
                    <span class="resource-icon">🌲</span>
                    Wood: <span id="wood-count">250</span>
                </div>
                <div class="resource energy">
                    <span class="resource-icon">⚡</span>
                    Energy: <span id="energy-count">100 / 100</span>
                </div>
                <div class="resource water">
                    <span class="resource-icon">💧</span>
                    Water: <span id="water-count">0 / 100</span>
                </div>
                <div class="resource titanium">
                    <span class="resource-icon">⬡</span>
                    Titanium: <span id="titanium-count">0</span>
                </div>
            </div>
            <button id="website-fullscreen" class="website-fullscreen-button" type="button" aria-label="Enter fullscreen">⛶ Fullscreen</button>
        </div>

        <div class="tool-shelf">
            <div class="tool-tabs" role="tablist" aria-label="Tool categories">
                <button class="tool-tab active" type="button" role="tab" aria-selected="true" data-tool-tab="build">Build</button>
                <button class="tool-tab" type="button" role="tab" aria-selected="false" data-tool-tab="weapons">Weapons</button>
                <button class="tool-tab" type="button" role="tab" aria-selected="false" data-tool-tab="utilities">Utilities</button>
                <button class="tool-tab" type="button" role="tab" aria-selected="false" data-tool-tab="tools">Tools</button>
                <button class="tool-tab" type="button" role="tab" aria-selected="false" data-tool-tab="bots">Bots</button>
            </div>

            <div class="toolbar-scroll">
                <div class="toolbar" aria-label="Available tools">
                    <button id="btn-wood" class="tool active" data-tool-category="build">
                        Wood
                        <small>Build</small>
                    </button>
                    <button id="btn-steel" class="tool" data-tool-category="build">
                        Steel
                        <small>Build</small>
                    </button>
                    <button id="btn-titanium" class="tool" data-tool-category="build" title="Build directly with stored Titanium">
                        Titanium
                        <small>1 Titanium / beam</small>
                    </button>
                    <button id="btn-wood-door" class="tool" data-tool-category="build">Wood Door<small>Door</small></button>
                    <button id="btn-steel-door" class="tool" data-tool-category="build">Steel Door<small>Door</small></button>
                    <button id="btn-cannon" class="tool" data-tool-category="weapons" title="Standard damage and reload">
                        Cannon
                        <small>100 Metal / 50 Energy</small>
                    </button>
                    <button id="btn-sniper" class="tool" data-tool-category="weapons" title="95 damage • perfectly straight, fast shot • 5.5 second reload">
                        Sniper
                        <small>230 Metal / 115 Energy</small>
                    </button>
                    <button id="btn-flak-cannon" class="tool" data-tool-category="weapons" title="Intercepts enemy bullets with proximity-fused explosions">
                        Flak Cannon
                        <small>190 Metal / 95 Energy</small>
                    </button>
                    <button id="btn-drill-bot" class="tool" type="button" data-tool-category="bots" hidden disabled title="Drill Bot deployment and digging mechanics are still in development">Drill Bot<small>In development</small></button>
                    <button id="btn-flak-settings" class="tool" type="button" data-tool-category="tools" hidden title="Select one player Flak Cannon to configure its settings">Flak Settings</button>
                    <button id="btn-select-tool" class="tool" type="button" data-tool-category="tools" aria-pressed="false" title="Select placed Research Stations"><span aria-hidden="true" style="color:#fff;font-size:18px">◎</span> Select Tool<small>Select objects</small></button>
                    <button id="btn-delete" class="tool" aria-pressed="false" data-tool-category="tools">
                        Delete
                        <small>Remove pieces</small>
                    </button>
                    <button id="btn-repair" class="tool" aria-pressed="false" data-tool-category="tools">
                        Repair
                        <small>Fix damaged beams</small>
                    </button>
                    <button id="btn-upgrade" class="tool" type="button" data-tool-category="tools" aria-pressed="false" title="Upgrade wooden beams to steel with metal, then steel beams to titanium using stored titanium">Upgrade<small>Steel: 5–10 Metal • Titanium: 1 per beam</small></button>
                    <button id="btn-link" class="tool" aria-pressed="false" data-tool-category="tools">Link<small>Connect weapons to doors</small></button>
                </div>
            </div>
        </div>
    </div>
    <div id="placement-message" role="status" aria-live="polite"></div>
    <div id="door-confirm-actions" hidden aria-label="Door placement actions">
        <button id="btn-confirm-door" type="button">CONFIRM</button>
        <button id="btn-cancel-door" type="button" aria-label="Cancel door placement">×</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <nav id="mobile-controls" aria-label="Mobile game controls">
        <div class="mobile-camera-pad" aria-label="Camera movement">
            <button type="button" data-mobile-action="pan-up" aria-label="Move camera up">▲</button>
            <div>
                <button type="button" data-mobile-action="pan-left" aria-label="Move camera left">◀</button>
                <button type="button" data-mobile-action="pan-down" aria-label="Move camera down">▼</button>
                <button type="button" data-mobile-action="pan-right" aria-label="Move camera right">▶</button>
            </div>
            <div>
                <button type="button" data-mobile-action="zoom-out" aria-label="Zoom out">−</button>
                <button type="button" data-mobile-action="zoom-in" aria-label="Zoom in">+</button>
            </div>
        </div>
        <button type="button" data-mobile-action="deselect" aria-label="Deselect all selected guns">✕</button>
        <button type="button" data-mobile-action="group-select" aria-label="Hold to select multiple guns" title="Hold while selecting guns" hidden>GROUP</button>
        <button type="button" data-mobile-action="pause" aria-label="Pause game">Ⅱ</button>
    </nav>

    <!-- Matter.js physics engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

    <!-- Game scripts: order matters -->
    <script src="js/config.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/building.js"></script>
    <script src="js/weapons.js"></script>
    <script src="js/drill-bot.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/updater-ui.js"></script>
    <script src="js/main.js"></script>
    <!-- Diagnostics are loaded only by the Electron desktop build. -->
    <script>
        if (window.ccUpdater) {
            const debugScript = document.createElement("script");
            debugScript.src = "js/debug-panel.js?v=1.4.3";
            document.head.appendChild(debugScript);
        }
    </script>

    <script>
        // Fullscreen is a browser-website feature; keep it out of installed and desktop app modes.
        (() => {
            const button = document.getElementById("website-fullscreen");
            if (!button) return;
            const standalone = window.matchMedia("(display-mode: standalone)").matches ||
                window.matchMedia("(display-mode: fullscreen)").matches ||
                navigator.standalone === true;
            const browserWebsite = /^https?:$/.test(window.location.protocol) &&
                !standalone && !window.ccUpdater;
            if (!browserWebsite || !document.documentElement.requestFullscreen) {
                button.hidden = true;
                return;
            }
            button.addEventListener("click", async () => {
                try {
                    if (document.fullscreenElement) {
                        await document.exitFullscreen();
                    } else {
                        await document.documentElement.requestFullscreen();
                    }
                } catch (error) {
                    console.warn("Fullscreen could not be enabled:", error);
                }
            });
            document.addEventListener("fullscreenchange", () => {
                const active = Boolean(document.fullscreenElement);
                button.textContent = active ? "⤢ Exit fullscreen" : "⛶ Fullscreen";
                button.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
            });
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js").catch(error => {
                    console.warn("Crimson Castle offline support could not start:", error);
                });
            });
        }
    </script>
</body>
</html>
