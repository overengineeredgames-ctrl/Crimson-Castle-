<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crimson Castle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="hud">
        <div class="hud-topline">
            <div class="game-brand">
                <div class="game-title">CRIMSON CASTLE</div>
                <div class="cc-battle-version cc-version-label">Loading version...</div>
            </div>

            <div class="resources">
                <div class="resource metal">
                    <span class="resource-icon">◆</span>
                    Metal: <span id="metal-count">500</span>
                </div>
                <div class="resource wood">
                    <span class="resource-icon">🌲</span>
                    Wood: <span id="wood-count">250</span>
                </div>
                <div class="resource energy">
                    <span class="resource-icon">⚡</span>
                    Energy: <span id="energy-count">100</span>
                </div>
            </div>
        </div>

        <div class="tool-shelf">
            <div class="tool-tabs" role="tablist" aria-label="Tool categories">
                <button class="tool-tab active" type="button" role="tab" aria-selected="true" data-tool-tab="build">Build</button>
                <button class="tool-tab" type="button" role="tab" aria-selected="false" data-tool-tab="weapons">Weapons</button>
                <button class="tool-tab" type="button" role="tab" aria-selected="false" data-tool-tab="utilities">Utilities</button>
                <button class="tool-tab" type="button" role="tab" aria-selected="false" data-tool-tab="tools">Tools</button>
            </div>

            <div class="toolbar-scroll">
                <div class="toolbar" aria-label="Available tools">
                    <button id="btn-wood" class="tool active" data-tool-category="build">
                        Wood
                        <small>Build</small>
                    </button>
                    <button id="btn-steel" class="tool" data-tool-category="build">
                        Steel
                        <small>Build</small>
                    </button>
                    <button id="btn-cannon" class="tool" data-tool-category="weapons" title="Standard damage and reload">
                        Cannon
                        <small>100 Metal / 50 Energy</small>
                    </button>
                    <button id="btn-delete" class="tool" aria-pressed="false" data-tool-category="tools">
                        Delete
                        <small>Remove pieces</small>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="placement-message" role="status" aria-live="polite"></div>
    <canvas id="gameCanvas"></canvas>

    <nav id="mobile-controls" aria-label="Mobile game controls">
        <button type="button" data-mobile-action="pan-left" aria-label="Move camera left">◀</button>
        <button type="button" data-mobile-action="pan-right" aria-label="Move camera right">▶</button>
        <button type="button" data-mobile-action="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" data-mobile-action="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" data-mobile-action="fire" aria-label="Fire selected weapons">FIRE</button>
        <button type="button" data-mobile-action="pause" aria-label="Pause game">Ⅱ</button>
    </nav>

    <!-- Matter.js physics engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

    <!-- Game scripts: order matters -->
    <script src="js/config.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/building.js"></script>
    <script src="js/weapons.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/updater-ui.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
