name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Crimson Castle for Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install game and Android wrapper dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund matter-js@0.20.0 @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare offline-ready game files
        shell: bash
        run: |
          rm -rf www
          mkdir -p www/vendor www/assets
          cp index.html styles.css CrimsonCastle.ico manifest.json www/
          cp -R js www/js
          # Keep diagnostics in source/desktop builds, never in the public APK.
          rm -f www/js/debug-panel.js
          cp -R assets/. www/assets/
          cp node_modules/matter-js/build/matter.min.js www/vendor/matter.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js#vendor/matter.min.js#' www/index.html
          # Mark this packaged copy so the Android-only GROUP control is enabled.
          sed -i '/<script src="js\/main.js"><\/script>/i\    <script>window.CC_ANDROID_APK = true;</script>' www/index.html

      - name: Verify packaged game files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css manifest.json js/config.js js/physics.js js/building.js js/weapons.js js/ai.js js/updater-ui.js js/main.js vendor/matter.min.js assets/mobile-launcher.svg; do
            test -s "www/$file" || { echo "Missing required APK asset: www/$file"; exit 1; }
          done
          test ! -e www/js/debug-panel.js
          ! grep -q '<script src="js/debug-panel.js' www/index.html
          grep -q "forceDeselectGuns" www/js/weapons.js
          grep -q 'data-mobile-action="deselect"' www/index.html
          grep -q 'data-mobile-action="group-select"' www/index.html
          grep -q "groupSelectMode" www/js/weapons.js
          grep -q "updateSniperFireButton" www/js/weapons.js
          grep -q "enterDrillBotCamera" www/js/main.js
          grep -q "updateDrillBotCamera" www/js/main.js
          grep -q "Game.enterDrillBotCamera" www/js/drill-bot.js
          grep -q "Game.exitDrillBotCamera" www/js/drill-bot.js
          grep -q "cc-drill-bot-mode" www/styles.css
          grep -q "mobile-camera-pad" www/styles.css
          grep -q "syncMobilePad" www/js/drill-bot.js
          VERSION=$(node -p "require('./package.json').version")
          echo "Verified Crimson Castle v${VERSION}: sniper fire control, Android group selection, deselect control, physics engine, manifest and assets; no APK debug panel."

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android launcher icon and force landscape
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Use dedicated mobile artwork; desktop continues using CrimsonCastle.ico.
          import cairosvg
          cairosvg.svg2png(url="assets/mobile-launcher.svg", write_to="mobile-launcher.png",
                           output_width=512, output_height=512)
          icon = Image.open("mobile-launcher.png").convert("RGBA")

          # Generate every web-manifest icon referenced by index.html/manifest.json.
          web_assets = Path("www/assets")
          web_assets.mkdir(parents=True, exist_ok=True)
          icon.resize((192,192), Image.Resampling.LANCZOS).save(web_assets / "icon-192.png")
          icon.resize((512,512), Image.Resampling.LANCZOS).save(web_assets / "icon-512.png")
          icon.resize((180,180), Image.Resampling.LANCZOS).save(web_assets / "apple-touch-icon.png")

          # Legacy launcher icons for older Android versions.
          for density, size in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              resized = icon.resize((size,size), Image.Resampling.LANCZOS)
              resized.save(folder / "ic_launcher.png")
              resized.save(folder / "ic_launcher_round.png")

          # Full-bleed adaptive foreground; do not add extra empty padding.
          foreground = icon.resize((432,432), Image.Resampling.LANCZOS)
          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          foreground.save(drawable / "crimson_launcher_foreground.png")

          # A unique background resource avoids collisions with Capacitor defaults.
          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          (values / "crimson_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources><color name="crimson_launcher_background">#101827</color></resources>\n',
              encoding="utf-8"
          )

          adaptive = Path("android/app/src/main/res/mipmap-anydpi-v26")
          adaptive.mkdir(parents=True, exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/crimson_launcher_background"/>\n'
              '  <foreground android:drawable="@drawable/crimson_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (adaptive / "ic_launcher.xml").write_text(adaptive_xml, encoding="utf-8")
          (adaptive / "ic_launcher_round.xml").write_text(adaptive_xml, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          app.set(android+"icon", "@mipmap/ic_launcher")
          app.set(android+"roundIcon", "@mipmap/ic_launcher_round")
          activity = app.find("activity")
          if activity is None: raise RuntimeError("Capacitor activity not found")
          activity.set(android+"screenOrientation", "landscape")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Keep Android's clock, battery, signal and navigation bars hidden
          # while Crimson Castle is running (immersive sticky fullscreen).
          java_dir = Path("android/app/src/main/java/com/overengineeredgames/crimsoncastle")
          java_dir.mkdir(parents=True, exist_ok=True)
          main_activity = java_dir / "MainActivity.java"
          main_activity.write_text("""package com.overengineeredgames.crimsoncastle;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }
          }
          """, encoding="utf-8")
          PY

      - name: Build installable APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Name APK
        id: apk
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK="Crimson-Castle-MOBILE-v${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-Castle-MOBILE
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.apk.outputs.version }}"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Crimson Castle v${VERSION}" --notes "Crimson Castle Android and desktop release."
          fi
          gh release upload "$TAG" "${{ steps.apk.outputs.apk }}" --clobber
