name: Publish Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Crimson Castle
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create version tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            git tag $tag
            git push origin "refs/tags/$tag"
          } else {
            Write-Host "Tag $tag already exists; using it."
          }

      - name: Build and publish Windows installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portable ZIP
        run: npm run dist:portable

      - name: Upload portable ZIP to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $zip = Get-ChildItem -Path dist -Filter "*-Desktop.zip" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $zip) {
            throw "Portable ZIP was not created in the dist folder."
          }
          gh release upload "v$version" $zip.FullName --clobber
          Write-Host "Uploaded portable package: $($zip.Name)"
