name: Deploy Crimson Castle Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Prepare website and iPhone icons
        run: |
          mkdir -p dist
          cp index.html styles.css CrimsonCastle.ico manifest.json service-worker.js dist/
          cp -R js assets dist/
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/mobile-launcher.svg", write_to="dist/assets/apple-touch-icon.png", output_width=180, output_height=180)
          cairosvg.svg2png(url="assets/mobile-launcher.svg", write_to="dist/assets/icon-192.png", output_width=192, output_height=192)
          cairosvg.svg2png(url="assets/mobile-launcher.svg", write_to="dist/assets/icon-512.png", output_width=512, output_height=512)
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
